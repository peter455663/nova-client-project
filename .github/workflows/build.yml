name: Build Nova Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Nova-Utility-Client-0.2.0-source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source project
        run: |
          mkdir source
          unzip -q Nova-Utility-Client-0.2.0-source.zip -d source
          PROJECT_DIR="source/NovaUtilityClient-26.3"
          test -d "$PROJECT_DIR/src/client/java/hu/peter/nova"
          cp fixes/NovaClient.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaClient.java"
          cp fixes/NovaClickGuiScreen.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaClickGuiScreen.java"
          echo "Extracted project files and applied the checked-in 26.3 compatibility fixes:"
          find source -maxdepth 4 -type f | sort | head -200

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric mod
        shell: bash
        run: |
          PROJECT_DIR="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | sort -u | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Gradle project files in the ZIP."
            exit 1
          fi
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Utility-Client-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
