name: Build Nova Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Nova-Utility-Client-0.2.0-source.zip'
      - 'fixes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project and apply Nova 0.5.0 sources
        run: |
          mkdir source
          unzip -q Nova-Utility-Client-0.2.0-source.zip -d source
          PROJECT_DIR="source/NovaUtilityClient-26.3"
          test -d "$PROJECT_DIR/src/client/java/hu/peter/nova"
          cp fixes/NovaClient.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaClient.java"
          cp fixes/NovaClickGuiScreen.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaClickGuiScreen.java"
          cp fixes/NovaConfig.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaConfig.java"
          cp fixes/NovaCategoryScreen.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaCategoryScreen.java"
          cp fixes/NovaAutomation.java "$PROJECT_DIR/src/client/java/hu/peter/nova/NovaAutomation.java"
          sed -i 's/^mod_version=.*/mod_version=0.5.0/' "$PROJECT_DIR/gradle.properties"
          echo "Applied Nova 0.4.0 source files:"
          find "$PROJECT_DIR/src/client/java/hu/peter/nova" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric mod
        shell: bash
        run: |
          cd source/NovaUtilityClient-26.3
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Utility-Client-0.5.0-JAR
          path: source/NovaUtilityClient-26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14