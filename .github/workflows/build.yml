name: Build Nova Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Nova-Utility-Client-0.2.0-source.zip'
      - 'fixes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project and apply Nova 0.8.0 sources
        run: |
          mkdir source
          unzip -q Nova-Utility-Client-0.2.0-source.zip -d source
          PROJECT_DIR="source/NovaUtilityClient-26.3"
          test -d "$PROJECT_DIR/src/client/java/hu/peter/nova"
          cp fixes/*.java "$PROJECT_DIR/src/client/java/hu/peter/nova/"
          if [ -d fixes/resources ]; then cp -r fixes/resources/. "$PROJECT_DIR/src/client/resources/"; fi
          if [ -f fixes/fabric.mod.json ]; then cp fixes/fabric.mod.json "$PROJECT_DIR/src/main/resources/fabric.mod.json"; fi
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' "$PROJECT_DIR/gradle.properties"
          echo "Applied Nova 0.4.0 source files:"
          find "$PROJECT_DIR/src/client/java/hu/peter/nova" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric mod
        shell: bash
        run: |
          cd source/NovaUtilityClient-26.3
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: API probe (diagnostics)
        if: always()
        shell: bash
        run: |
          for pat in 'fabric-command-api-v2*' 'fabric-rendering-v1*' 'fabric-key-mapping*' 'fabric-lifecycle-events*'; do
            for j in $(find ~/.gradle -name "$pat.jar" ! -name '*sources*' 2>/dev/null | head -2); do
              echo "== $j"; unzip -l "$j" | awk '{print $4}' | grep '\.class$' | grep -v '\$' | head -60
            done
          done
          for j in $(find ~/.gradle -iname 'minecraft*26.3*.jar' ! -name '*sources*' 2>/dev/null | head -1); do
            echo "== MC $j"; echo "$j" > /tmp/mcjar
          done
          if [ -f /tmp/mcjar ]; then J=$(cat /tmp/mcjar);
            javap -cp "$J" net.minecraft.client.Minecraft | grep -iE "screen|gui|player|level|options|getInstance" | head -30 || true
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Utility-Client-JAR
          path: source/NovaUtilityClient-26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14