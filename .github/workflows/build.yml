name: Build Nova Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'Nova-Utility-Client-0.2.0-source.zip'
      - 'fixes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project and apply Nova 0.8.0 sources
        run: |
          mkdir source
          unzip -q Nova-Utility-Client-0.2.0-source.zip -d source
          PROJECT_DIR="source/NovaUtilityClient-26.3"
          test -d "$PROJECT_DIR/src/client/java/hu/peter/nova"
          cp fixes/*.java "$PROJECT_DIR/src/client/java/hu/peter/nova/"
          if [ -d fixes/resources ]; then cp -r fixes/resources/. "$PROJECT_DIR/src/client/resources/"; fi
          if [ -f fixes/fabric.mod.json ]; then cp fixes/fabric.mod.json "$PROJECT_DIR/src/main/resources/fabric.mod.json"; fi
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' "$PROJECT_DIR/gradle.properties"
          echo "Applied Nova 0.4.0 source files:"
          find "$PROJECT_DIR/src/client/java/hu/peter/nova" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric mod
        shell: bash
        run: |
          cd source/NovaUtilityClient-26.3
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: API probe (diagnostics)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +o pipefail
          cp "$GITHUB_WORKSPACE/scripts/probe-classes.txt" /tmp/pc.txt
          CP=$(find ~/.gradle ~/work -name '*.jar' ! -name '*sources*' -size +100k 2>/dev/null | tr '\n' ':')
          while IFS='|' read -r cls pats; do
            echo "=== $cls"
            RE=$(echo "$pats" | tr '|' '\n' | paste -sd'|')
            javap -public -cp "$CP" "$cls" 2>&1 | grep -E "$RE|Compiled from|class |interface |enum " | head -40
          done < /tmp/pc.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Utility-Client-JAR
          path: source/NovaUtilityClient-26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14